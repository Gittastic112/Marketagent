# Disposable recovery only: no host ports, normal volumes or provider secrets.
services:
  postgres-e2e:
    image: market-intelligence-postgres:local
    build:
      context: ./docker/postgres
    environment:
      POSTGRES_USER: marketintel
      POSTGRES_PASSWORD: recovery-fixture-only
      POSTGRES_DB: marketintel_e2e
    tmpfs:
      - /var/lib/postgresql/data:rw,noexec,nosuid,size=2g
    mem_limit: 1g
    pids_limit: 128
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U marketintel -d marketintel_e2e"]
      interval: 2s
      timeout: 3s
      retries: 30
  backend-e2e:
    image: ${RECOVERY_BACKEND_IMAGE:-market-intelligence-recovery:local}
    build:
      context: .
      dockerfile: backend/Dockerfile
      target: test
    environment:
      DATABASE_URL: postgresql+psycopg://marketintel:recovery-fixture-only@postgres-e2e:5432/marketintel_e2e
      APP_ENV: test
      RESTORE_DRILL_DISPOSABLE: "1"
      SEC_USER_AGENT: Market Intelligence recovery tests@example.invalid
      NEXTAUTH_SECRET: recovery-fixture-secret-not-for-runtime
    command: sh -c "alembic upgrade head && uvicorn app.main:app --app-dir backend --host 0.0.0.0 --port 8000"
    volumes:
      - ./scripts:/workspace/scripts:ro
    mem_limit: 768m
    pids_limit: 128
    depends_on:
      postgres-e2e:
        condition: service_healthy
networks:
  default:
    internal: true
