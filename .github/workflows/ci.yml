name: CI

on:
  push:
    branches: [codex/worktree-recovery]
    tags: ['**']
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  container-security:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Build the supported application images
        run: |
          docker build -f backend/Dockerfile -t market-intelligence-os-backend .
          docker build -t market-intelligence-os-frontend frontend
          docker build -t market-intelligence-postgres:local docker/postgres
      - name: Inventory container OS packages and block available severe fixes
        run: bash scripts/scan_container_images.sh market-intelligence-os-backend market-intelligence-os-frontend market-intelligence-postgres:local
      - name: Preserve complete container scan reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: container-os-inventories
          path: output/security/container-scan/image-*.json

  recovery-quality-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Verify concurrent backup and disposable PostgreSQL recovery
        run: bash scripts/drill_backup_restore.sh

  dependency-security:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.14'
      - name: Audit frontend lockfile (package metadata only)
        working-directory: frontend
        run: npm audit --audit-level=moderate
      - name: Audit resolved backend dependencies (package metadata only)
        run: |
          python scripts/check_dependency_locks.py
          python -m pip install pip-audit==2.10.1
          pip-audit -r backend/requirements-test.lock --progress-spinner off --require-hashes

  release-baseline:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 2
      - name: Check patch formatting
        # PR checkouts use a merge commit; its first parent is the target branch.
        run: git diff --check HEAD^ HEAD
        if: >-
          github.event_name == 'pull_request' ||
          (github.event_name == 'push' &&
           github.event.before != '0000000000000000000000000000000000000000')
      - name: Run repository static quality gates
        run: |
          python3 -m unittest scripts.test_check_docs
          python3 scripts/check_docs.py
          python3 -m unittest scripts.test_check_secrets
          python3 -m unittest scripts.test_local_compose
          python3 -m unittest scripts.test_backup_workflow
          python3 -m unittest scripts.test_recovery_metadata
          python3 -m unittest scripts.test_dependency_locks
          python3 -m unittest scripts.test_container_scan
          python3 scripts/check_dependency_locks.py
          python3 scripts/check_secrets.py
          python3 scripts/validate_project_skills.py
          bash scripts/test_workstream_ownership.sh
          bash scripts/check_workstream_ownership.sh
      - name: Verify clean-checkout backend, migration, and frontend baseline
        run: ./scripts/verify_release_baseline.sh

  browser-quality-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      NEXTAUTH_SECRET: ci-browser-secret-not-for-production
      LOCAL_AUTH_USERNAME: ci-browser-user
      LOCAL_AUTH_PASSWORD: ci-browser-password
      E2E_BROWSER_CHANNEL: chrome
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install browser test dependencies
        working-directory: frontend
        run: npm ci
      - name: Run isolated browser workflows
        run: ./scripts/run_browser_workflows.sh
      - name: Retain browser evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: browser-quality-artifacts
          retention-days: 7
          path: |
            output/playwright/test-results
            frontend/playwright-report
