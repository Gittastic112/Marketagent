name: CI

on:
  push:
    branches: [main]
    tags: ['**']
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repository-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      full_ci: ${{ steps.scope.outputs.full_ci }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Select required checks and validate the complete patch
        id: scope
        run: python3 scripts/ci_scope.py classify
      - name: Run repository static quality gates
        run: |
          python3 -m unittest scripts.test_check_docs
          python3 scripts/check_docs.py
          python3 -m unittest scripts.test_check_secrets
          python3 -m unittest scripts.test_local_compose
          python3 -m unittest scripts.test_backup_workflow
          python3 -m unittest scripts.test_recovery_metadata
          python3 -m unittest scripts.test_dependency_locks
          python3 -m unittest scripts.test_container_scan scripts.test_scan_container_workflow scripts.test_ci_scope
          python3 scripts/check_dependency_locks.py
          python3 scripts/check_secrets.py
          python3 scripts/validate_project_skills.py
          bash scripts/test_workstream_ownership.sh
          bash scripts/check_workstream_ownership.sh

  container-security:
    needs: repository-checks
    if: needs.repository-checks.outputs.full_ci == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build the supported application images
        run: |
          docker build -f backend/Dockerfile -t market-intelligence-os-backend .
          docker build -t market-intelligence-os-frontend frontend
          docker build -t market-intelligence-postgres:local docker/postgres
      - name: Inventory container OS packages and block available severe fixes
        run: bash scripts/scan_container_images.sh market-intelligence-os-backend market-intelligence-os-frontend market-intelligence-postgres:local
      - name: Preserve complete container scan reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: container-os-inventories
          path: output/security/container-scan/image-*.json

  recovery-quality-gate:
    needs: repository-checks
    if: needs.repository-checks.outputs.full_ci == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Verify concurrent backup and disposable PostgreSQL recovery
        run: bash scripts/drill_backup_restore.sh

  dependency-security:
    needs: repository-checks
    if: needs.repository-checks.outputs.full_ci == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.14'
      - name: Audit frontend lockfile (package metadata only)
        working-directory: frontend
        run: npm audit --audit-level=moderate
      - name: Audit resolved backend dependencies (package metadata only)
        run: |
          python scripts/check_dependency_locks.py
          python -m pip install pip-audit==2.10.1
          pip-audit -r backend/requirements-test.lock --progress-spinner off --require-hashes --timeout 60
          for profile in adapters extraction ocr; do
            pip-audit -r "backend/requirements-$profile.lock" --progress-spinner off --no-deps --disable-pip --timeout 60
          done

  release-baseline:
    needs: repository-checks
    if: needs.repository-checks.outputs.full_ci == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Verify clean-checkout backend, migration, and frontend baseline
        run: ./scripts/verify_release_baseline.sh
      - name: Verify installed optional research and table adapters without network
        run: |
          docker build -f backend/Dockerfile --target test --build-arg INSTALL_RESEARCH_ADAPTERS=true --build-arg INSTALL_TABLE_ADAPTERS=true -t market-intelligence-adapters-test .
          docker run --rm --network none -e DATABASE_URL=postgresql+psycopg://test:test@localhost/marketagent_test -e SEC_USER_AGENT='Marketagent CI adapter-tests@marketagent.test' -e APP_ENV=test -e OPENBLAS_NUM_THREADS=1 -e OMP_NUM_THREADS=1 market-intelligence-adapters-test python -m pytest -q -p no:cacheprovider backend/tests/adapters_market backend/tests/adapters_sources backend/tests/adapters_research
          docker run --rm --network none -e DATABASE_URL=postgresql+psycopg://test:test@localhost/marketagent_test -e SEC_USER_AGENT='Marketagent CI adapter-tests@marketagent.test' -e APP_ENV=test -v "$PWD/frontend/lib/api/generated:/contracts:ro" market-intelligence-adapters-test python backend/scripts/export_adapter_contracts.py --output /contracts/adapters.openapi.json --check

  browser-quality-gate:
    needs: repository-checks
    if: needs.repository-checks.outputs.full_ci == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      NEXTAUTH_SECRET: ci-browser-secret-not-for-production
      LOCAL_AUTH_USERNAME: ci-browser-user
      LOCAL_AUTH_PASSWORD: ci-browser-password
      E2E_BROWSER_CHANNEL: chrome
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install browser test dependencies
        working-directory: frontend
        run: npm ci
      - name: Verify generated adapter TypeScript
        working-directory: frontend
        run: npm run check:adapter-types
      - name: Run isolated browser workflows
        run: ./scripts/run_browser_workflows.sh
      - name: Retain browser evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: browser-quality-artifacts
          retention-days: 7
          path: |
            output/playwright/test-results
            frontend/playwright-report

  ci-result:
    if: always()
    needs: [repository-checks, container-security, recovery-quality-gate, dependency-security, release-baseline, browser-quality-gate]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Require every check selected for this change
        env:
          CI_NEEDS_JSON: ${{ toJSON(needs) }}
        run: python3 scripts/ci_scope.py gate
