x-logging: &bounded-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  postgres:
    image: market-intelligence-postgres:local
    build:
      context: ./docker/postgres
    container_name: market_intel_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: marketintel
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD privately before starting services}
      POSTGRES_DB: marketintel
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - marketintel_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U marketintel -d marketintel"]
      interval: 5s
      timeout: 5s
      retries: 10
    logging: *bounded-logging

  backend:
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 256
    mem_limit: 2g
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: market_intel_backend
    restart: unless-stopped
    init: true
    environment:
      DATABASE_URL: postgresql+psycopg://marketintel:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD privately before starting services}@postgres:5432/marketintel
      APP_ENV: local
      APP_NAME: Market Intelligence Engine
      ALERT_PRIORITY_THRESHOLD: ${ALERT_PRIORITY_THRESHOLD:-70}
      SEC_USER_AGENT: ${SEC_USER_AGENT:-Market Intelligence Engine local research app contact@example.com}
      FRED_API_KEY: ${FRED_API_KEY:-}
      VALUATION_REFRESH_ENABLED: ${VALUATION_REFRESH_ENABLED:-false}
      VALUATION_REFRESH_OWNER_ID: ${VALUATION_REFRESH_OWNER_ID:-local-user}
      MARKET_DATA_PROVIDER: ${MARKET_DATA_PROVIDER:-alphavantage}
      ALPHA_VANTAGE_API_KEY: ${ALPHA_VANTAGE_API_KEY:-}
      FMP_API_KEY: ${FMP_API_KEY:-}
      OPENFIGI_API_KEY: ${OPENFIGI_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-2.5-flash}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET:-}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:-}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      CORS_ORIGINS: ${CORS_ORIGINS:-["http://localhost:3000"]}
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - ./data:/workspace/data:ro
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/readiness', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 15s
    logging: *bounded-logging

  frontend:
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 256
    mem_limit: 1g
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: runner
    container_name: market_intel_frontend
    restart: unless-stopped
    init: true
    environment:
      API_BASE_URL: http://backend:8000
      NEXT_PUBLIC_BROWSER_API_BASE_URL: /api/backend
      NEXT_PUBLIC_DEBUG_LOGS: ${NEXT_PUBLIC_DEBUG_LOGS:-false}
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET:-}
      NEXTAUTH_URL: ${NEXTAUTH_URL:-http://localhost:3000}
      LOCAL_AUTH_USERNAME: ${LOCAL_AUTH_USERNAME:-}
      LOCAL_AUTH_PASSWORD: ${LOCAL_AUTH_PASSWORD:-}
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/auth/readiness').then(r => { if (!r.ok) process.exit(1) }).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 15s
    logging: *bounded-logging

  scheduler:
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 128
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: market_intel_scheduler
    restart: unless-stopped
    init: true
    profiles: ["automation"]
    command: ["python", "-m", "app.workers.daily_brief_scheduler"]
    environment:
      DATABASE_URL: postgresql+psycopg://marketintel:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD privately before starting services}@postgres:5432/marketintel
      APP_ENV: local
      APP_NAME: Market Intelligence Engine Scheduler
      SEC_USER_AGENT: ${SEC_USER_AGENT:-Market Intelligence Engine local research app contact@example.com}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      DAILY_BRIEF_SCHEDULER_INTERVAL_SECONDS: ${DAILY_BRIEF_SCHEDULER_INTERVAL_SECONDS:-60}
    mem_limit: 256m
    depends_on:
      backend:
        condition: service_healthy
    logging: *bounded-logging

  source_scheduler:
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 128
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: market_intel_source_scheduler
    restart: unless-stopped
    init: true
    profiles: ["automation"]
    command: ["python", "-m", "app.workers.valuation_source_scheduler"]
    environment:
      DATABASE_URL: postgresql+psycopg://marketintel:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD privately before starting services}@postgres:5432/marketintel
      APP_ENV: local
      SEC_USER_AGENT: ${SEC_USER_AGENT:-Market Intelligence Engine local research app contact@example.com}
      FRED_API_KEY: ${FRED_API_KEY:-}
      MARKET_DATA_PROVIDER: ${MARKET_DATA_PROVIDER:-alphavantage}
      ALPHA_VANTAGE_API_KEY: ${ALPHA_VANTAGE_API_KEY:-}
      FMP_API_KEY: ${FMP_API_KEY:-}
      VALUATION_REFRESH_ENABLED: ${VALUATION_REFRESH_ENABLED:-false}
      VALUATION_REFRESH_OWNER_ID: ${VALUATION_REFRESH_OWNER_ID:-local-user}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    mem_limit: 512m
    depends_on:
      backend:
        condition: service_healthy
    logging: *bounded-logging

  pgadmin:
    image: dpage/pgadmin4:8
    container_name: market_intel_pgadmin
    restart: "no"
    mem_limit: 512m
    profiles: ["admin"]
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@local.com
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD:-}
    ports:
      - "127.0.0.1:5050:80"
    depends_on:
      postgres:
        condition: service_healthy
    logging: *bounded-logging

volumes:
  marketintel_postgres_data:
